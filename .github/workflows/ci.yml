name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Phase 24: no key, password or token may ever enter the repository. The
  # whole history is scanned, so a secret removed in a later commit is
  # still caught (it must be rotated, not just deleted).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Scan git history for secrets (gitleaks)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.21.2 git /repo --redact --no-banner --exit-code 1

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: contractiq, POSTGRES_PASSWORD: ci_password, POSTGRES_DB: contractiq }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U contractiq" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
    env:
      DATABASE_URL: postgresql+asyncpg://contractiq:ci_password@localhost:5432/contractiq
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      LOCAL_STORAGE_PATH: /tmp/storage
      CONTRACTIQ_INTEGRATION: "1"
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      # Tesseract so OCR tests run in CI instead of being skipped.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests && ruff format --check app tests
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - run: pytest -q
      - name: Worker tests
        working-directory: workers
        run: mkdir -p .run && ln -sfn ../app .run/worker && PYTHONPATH=../backend:.run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build

  docker:
    needs: [secrets, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t contractiq-backend backend
      - run: docker build -t contractiq-worker -f workers/Dockerfile .
      - run: docker build -t contractiq-frontend frontend
