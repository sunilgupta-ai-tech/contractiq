# =============================================================================
# ContractIQ — local development stack
#
#   docker compose up --build
#
# Services talk to each other by service name (postgres, redis, qdrant),
# never localhost — the same code then points at RDS / ElastiCache /
# Qdrant Cloud in production purely through environment variables.
# =============================================================================

name: contractiq

x-backend-env: &backend-env
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-contractiq}:${POSTGRES_PASSWORD:-contractiq_dev_password}@postgres:5432/${POSTGRES_DB:-contractiq}
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    LOCAL_STORAGE_PATH: /data/storage

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contractiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contractiq_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-contractiq}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contractiq} -d ${POSTGRES_DB:-contractiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image ships without curl; use bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: runtime
    <<: *backend-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  backend:
    build:
      context: ./backend
      target: runtime
    <<: *backend-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports: ["8000:8000"]
    volumes:
      - ./backend/app:/srv/app/app
      - storage_data:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    <<: *backend-env
    volumes:
      - storage_data:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_DEMO_DATA: ${NEXT_PUBLIC_USE_DEMO_DATA:-true}
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  storage_data:
