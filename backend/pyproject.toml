[project]
name = "contractiq-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]  # asserts in tests; FastAPI Depends() in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# PDF/OCR libraries ship without (complete) type hints. Their calls are
# confined to app/document_processing, which converts everything into our
# typed dataclasses at the boundary, so untyped calls are allowed only there.
[[tool.mypy.overrides]]
module = ["pytesseract.*", "pdfplumber.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.document_processing.*"]
disallow_untyped_calls = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"migrations/**" = ["E501", "S608"]
"app/guardrails/prompt_injection.py" = ["E501"]
